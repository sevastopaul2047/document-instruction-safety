name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check src scripts tests"

  test:
    name: Test & Pipeline Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run Pytest test suite
        run: |
          python -m pytest -v

      - name: Run synthetic mock smoke test
        run: |
          python scripts/run_pilot.py --model mock --data synthetic --output results/ci-synthetic-smoke

      - name: Run PIArena fixture smoke test
        run: |
          python scripts/run_pilot.py --model mock --data piarena --output results/ci-piarena-smoke

      - name: Run offline rescore on mock smoke run
        run: |
          python scripts/rescore_pilot.py --input results/ci-piarena-smoke --output results/ci-rescore-test
